name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Check out official DSH
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dd6322d604e00eec1ba5e0c8541159906a21094a
          path: upstream/deepseek-harness
      - run: pnpm install --ignore-scripts --frozen-lockfile
        working-directory: upstream/deepseek-harness
      - name: Build official DSH packages
        run: pnpm run build:lib
        working-directory: upstream/deepseek-harness
      - run: npm ci --ignore-scripts
      - name: Validate release tag
        id: release
        run: node scripts/release-metadata.mjs
      - name: Require the release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify against official DSH
        run: npm run verify
        env:
          DSH_ROOT: ${{ github.workspace }}/upstream/deepseek-harness
      - name: Require reproducible tracked artifacts
        run: git diff --exit-code -- lib
      - run: npm pack --dry-run
      - name: Check whether this version already exists
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          if npm view "${package_name}@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Use an OIDC-capable npm CLI
        if: steps.registry.outputs.exists != 'true'
        run: npm install --global "npm@^11.5.1"
      - name: Publish to npm
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --provenance --access public --tag "${{ steps.release.outputs.npm_tag }}"
